name: ci

on:
  push:
    branches:
      - main
      - branch1
      - branch2
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Install Dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y g++
        sudo apt-get install -y build-essential libgtest-dev googletest

    - name: Build
      run: make

    - name: Run
      run: |
        ./bmp_processor

    - name: Build test
      run: make tests

    - name: Run test
      run: |
        ./tests
